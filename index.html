<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111">
<title>DISC 增員攻心術</title>
<link rel="stylesheet" href="css/style.css">
<style>html,body{width:100%;height:100%;margin:0}body{overflow:hidden;background:#0b0b12}#app{width:100%;height:100dvh;display:flex;align-items:center;justify-content:center;overflow:hidden}.stage{position:relative;height:100dvh;width:66.6666667dvh;aspect-ratio:2/3;overflow:hidden;background:#fff}.page-image{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:fill}</style>
</head>
<body>
<main id="app" aria-label="DISC 增員攻心術互動網站">
  <section id="stage" class="stage" aria-live="polite">
    <img id="pageImage" class="page-image" src="assets/home.webp" alt="DISC 增員攻心術首頁" draggable="false" decoding="async">
    <div id="hotspots" class="hotspots"></div>
    <div id="titleOverlay" class="title-overlay" aria-hidden="true"></div>
    <button id="musicControl" class="music-control" type="button" aria-label="背景音樂開關" hidden>♫</button>
    <audio id="bgm" loop preload="none"></audio>
    <div id="loading" class="loading" aria-hidden="true"><span></span></div>
  </section>
</main>
<script src="js/script.js" defer></script>
</body>
</html>
