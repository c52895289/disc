<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111">
<title>DISC 增員攻心術</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main id="app" aria-label="DISC 增員攻心術互動網站">
  <section id="stage" class="stage" aria-live="polite">
    <img id="pageImage" class="page-image" alt="" draggable="false" decoding="async">
    <div id="hotspots" class="hotspots"></div>
    <div id="titleOverlay" class="title-overlay" aria-hidden="true"></div>
    <button id="musicControl" class="music-control" type="button" aria-label="背景音樂開關" hidden>♫</button>
    <audio id="bgm" loop preload="none"></audio>
    <div id="loading" class="loading" aria-hidden="true"><span></span></div>
  </section>
</main>
<script src="js/script.js" defer></script>
</body>
</html>
